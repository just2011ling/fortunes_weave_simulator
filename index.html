<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f5f2eb" />
  <meta name="description" content="万缕千丝转职模拟器：查看成长率、能力值与职业路线，并使用凹点辅助。" />
  <title>万缕千丝 · 转职模拟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/simulator.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="#/simulation" aria-label="万缕千丝首页"><span>万缕千丝</span></a>
    <nav class="main-nav" aria-label="主菜单"><button class="nav-item active" data-page="simulation">转职模拟</button><button class="nav-item" data-page="skills">凹点辅助</button></nav>
  </header>

  <main class="layout">
    <aside class="sidebar" id="characterSidebar">
      <div class="search-wrap"><span class="search-icon">⌕</span><input id="searchInput" type="search" placeholder="按名称搜索…" autocomplete="off"></div>
      <div class="roster-label"><span>可用角色</span><span id="shownCount">—</span></div>
      <div class="character-list" id="characterList" role="listbox" aria-label="选择角色"><div class="character-list-items"></div></div>
    </aside>

    <section class="workspace" id="simulationPage">
      <div class="scenario-picker"><label for="scenarioSelect">加入章节</label><select id="scenarioSelect" aria-label="选择角色加入章节"></select></div>
      <section class="detail-card growth-card full-growth-card">
        <div class="detail-title"><div><h3><span id="growthCharacterName">—</span> · 成长率</h3></div><span class="detail-caption" id="growthTotalCaption">角色与当前职业合计</span></div>
        <div class="stats-grid full-stats-grid ability-grid" id="statsGrid"></div>
      </section>

      <section class="detail-card ability-card full-row-card">
          <div class="detail-title"><div><h3>能力值</h3></div><span class="current-class-badge" id="abilityClassBadge">—</span><span class="calculation-note">平均期望值 · 按转职路线逐级计算</span></div>
          <div class="ability-grid" id="abilityGrid"></div>
      </section>

      <section class="detail-card route-card full-row-card">
          <div class="route-heading">
            <div class="detail-title"><h3>转职路线</h3></div>
            <div class="route-controls">
              <button id="resetRoute" class="reset-button" type="button">重置</button>
              <div class="level-control">
                <button id="levelDownFive" class="level-button level-step-button" aria-label="降低五级">−5</button>
                <button id="levelDown" class="level-button" aria-label="降低等级">−</button>
                <div class="level-readout"><span>当前等级</span><b id="levelValue">1</b></div>
                <button id="levelUp" class="level-button" aria-label="提升等级">＋</button>
                <button id="levelUpFive" class="level-button level-step-button" aria-label="提升五级">+5</button>
              </div>
            </div>
          </div>
          <div class="route-list" id="routeList"></div>
      </section>

    </section>

    <dialog class="job-picker-dialog" id="jobPickerDialog" aria-labelledby="jobPickerTitle">
      <div class="job-picker-dialog-content">
        <header class="job-picker-dialog-header">
          <div>
            <span class="dialog-eyebrow">职业列表</span>
            <h2 id="jobPickerTitle">选择职业</h2>
          </div>
          <button class="dialog-close" id="closeJobPicker" type="button" aria-label="关闭职业选择">×</button>
        </header>
        <div class="job-picker-tabs" id="jobPickerTabs" role="tablist" aria-label="职业分类"></div>
        <div class="job-picker-panel" id="jobPickerPanel" role="tabpanel" aria-live="polite"></div>
      </div>
    </dialog>

    <section class="workspace skills-page" id="skillsPage" hidden>
      <div class="skills-empty"><h1>凹点辅助</h1><p>这里将提供凹点培养相关的辅助信息。</p><span class="coming-soon">内容整理中</span></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
