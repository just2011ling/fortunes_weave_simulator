<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f5f2eb" />
  <meta name="description" content="万缕千丝转职模拟器：查看成长率、能力值与职业路线，并使用凹点辅助。" />
  <title>万缕千丝 · 转职模拟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/simulator.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="#/simulation" aria-label="万缕千丝首页"><span>万缕千丝</span></a>
    <nav class="main-nav" aria-label="主菜单"><button class="nav-item active" data-page="simulation">转职模拟</button><button class="nav-item" data-page="skills">凹点辅助</button></nav>
  </header>

  <main class="layout">
    <section class="workspace" id="simulationPage">
      <div class="scenario-picker">
        <button class="character-picker-button" id="openCharacterPicker" type="button">选择角色</button>
        <details class="character-filter-menu scenario-menu" id="scenarioMenu">
          <summary id="scenarioMenuSummary">加入章节</summary>
          <div class="character-filter-menu-panel scenario-menu-options" id="scenarioMenuOptions" role="radiogroup" aria-label="选择加入章节"></div>
        </details>
      </div>
      <section class="detail-card growth-card full-growth-card">
        <div class="detail-title"><div><h3><span id="growthCharacterName">—</span> · 成长率</h3></div><span class="detail-caption" id="growthTotalCaption">角色与当前职业合计</span></div>
        <div class="stats-grid full-stats-grid ability-grid" id="statsGrid"></div>
      </section>

      <section class="detail-card ability-card full-row-card">
          <div class="detail-title"><div><h3>能力值</h3></div><span class="current-class-badge" id="abilityClassBadge">—</span><span class="calculation-note">平均期望值 · 按转职路线逐级计算</span></div>
          <div class="ability-grid" id="abilityGrid"></div>
      </section>

      <section class="detail-card route-card full-row-card">
          <div class="route-heading">
            <div class="route-title-group">
              <div class="detail-title"><h3>转职路线</h3></div>
              <button id="resetRoute" class="reset-button" type="button" aria-label="重置转职路线" title="重置转职路线">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8.25M3 3v5.25h5.25M12 7v5l3.25 2" /></svg>
              </button>
            </div>
            <div class="route-controls">
              <div class="level-control">
                <button id="levelDownFive" class="level-button level-step-button" aria-label="降低五级">−5</button>
                <button id="levelDown" class="level-button" aria-label="降低等级">−</button>
                <div class="level-readout"><span>Lv.</span><b id="levelValue">1</b></div>
                <button id="levelUp" class="level-button" aria-label="提升等级">＋</button>
                <button id="levelUpFive" class="level-button level-step-button" aria-label="提升五级">+5</button>
              </div>
            </div>
          </div>
          <div class="route-list" id="routeList"></div>
      </section>

    </section>

    <dialog class="job-picker-dialog" id="jobPickerDialog" aria-labelledby="jobPickerTitle">
      <div class="job-picker-dialog-content">
        <header class="job-picker-dialog-header">
          <div>
            <span class="dialog-eyebrow">职业列表</span>
            <h2 id="jobPickerTitle">选择职业</h2>
          </div>
          <button class="dialog-close" id="closeJobPicker" type="button" aria-label="关闭职业选择">×</button>
        </header>
        <div class="job-picker-tabs" id="jobPickerTabs" role="tablist" aria-label="职业分类"></div>
        <div class="job-picker-panel" id="jobPickerPanel" role="tabpanel" aria-live="polite"></div>
      </div>
    </dialog>

    <dialog class="job-picker-dialog character-picker-dialog" id="characterPickerDialog" aria-labelledby="characterPickerTitle">
      <div class="job-picker-dialog-content">
        <header class="job-picker-dialog-header">
          <div>
            <span class="dialog-eyebrow">角色列表</span>
            <h2 id="characterPickerTitle">选择角色</h2>
          </div>
          <button class="dialog-close" id="closeCharacterPicker" type="button" aria-label="关闭角色选择">×</button>
        </header>
        <div class="character-picker-filters">
          <div class="character-filter-menu-wrap">
            <span class="character-filter-label">性别</span>
            <details class="character-filter-menu" id="genderFilterMenu">
              <summary id="genderFilterSummary">全部</summary>
              <div class="character-filter-menu-panel gender-filter-options" id="genderFilterOptions" role="radiogroup" aria-label="性别筛选"></div>
            </details>
          </div>
          <div class="character-filter-menu-wrap">
            <span class="character-filter-label">阵营</span>
            <details class="character-filter-menu" id="factionFilterMenu">
              <summary id="factionFilterSummary">全部阵营</summary>
              <div class="character-filter-menu-panel faction-filter-options" id="factionFilterOptions" role="group" aria-label="阵营筛选"></div>
            </details>
          </div>
        </div>
        <div class="character-picker-list" id="characterPickerList" role="listbox" aria-label="所有角色"></div>
      </div>
    </dialog>

    <section class="workspace skills-page" id="skillsPage" hidden>
      <div class="skills-empty"><h1>凹点辅助</h1><p>这里将提供凹点培养相关的辅助信息。</p><span class="coming-soon">内容整理中</span></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
